<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Grace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <a class="brand" href="../marketing/index.html"><span class="brand-mark">G</span><span>Grace</span></a>
      <span class="eyebrow">Admin · Private wedding room</span>
      <h1>Log in or sign up.</h1>
      <p class="intro">Enter your email and we’ll send a secure sign-in link. New Tucker + Syd accounts enter the wedding code after verifying their email.</p>
      <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <button type="submit" id="submitButton">Email me a sign-in link</button>
      </form>
      <div class="notice" id="notice" role="status" aria-live="polite"></div>
      <p class="privacy">Only pre-approved partner emails can use the wedding code.</p>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
