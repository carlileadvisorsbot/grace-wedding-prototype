<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grace — Wedding control center</title>
  <link rel="stylesheet" href="styles.css?v=20260831-2">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="../marketing/index.html" aria-label="Grace home">
        <span class="brand-mark">G</span><span>Grace</span>
      </a>
      <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
      <div class="wedding-title">
        <strong id="weddingName">Tucker &amp; Syd</strong>
        <span id="weddingMeta">Planning preview · sample data</span>
      </div>
      <div class="top-actions">
        <span class="sync-state" id="syncState"><i></i> Interactive prototype · sample data</span>
        <a class="button subtle desktop-only" href="../wedding/index.html">View our site ↗</a>
        <button class="avatar-stack" id="accountButton" aria-label="Account menu" aria-controls="accountMenu" aria-expanded="false">
          <span class="avatar t">T</span><span class="avatar s">S</span><span class="avatar g">G</span>
        </button>
      </div>
      <div class="account-menu" id="accountMenu">
        <strong id="accountName">Prototype partner</strong><span id="accountRole">Demo · not signed in</span>
        <a href="#settings" id="accountSettings">Settings</a>
        <a href="../marketing/index.html" id="logoutButton">Leave demo</a>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="nav-group-label">Wedding</div>
      <nav id="mainNav">
        <button class="nav-item active" data-view="overview"><span>⌂</span>Home</button>
        <button class="nav-item" data-view="guests"><span>♙</span>Guest list</button>
        <button class="nav-item" data-view="website"><span>✦</span>Website</button>
        <button class="nav-item" data-view="registry"><span>◇</span>Registry</button>
        <button class="nav-item" data-view="settings"><span>⚙</span>Settings</button>
        <div class="nav-group-label plans">Plans</div>
        <button class="nav-item" data-view="rsvps"><span>✓</span>RSVPs</button>
        <button class="nav-item" data-view="tasks"><span>○</span>Tasks &amp; decisions <b>8</b></button>
        <button class="nav-item" data-view="budget"><span>$</span>Budget</button>
        <button class="nav-item" data-view="vendors"><span>⌁</span>Vendors <b>6</b></button>
      </nav>
      <div class="sidebar-bottom">
        <a href="../wedding/index.html" class="site-mini">
          <span class="mini-eyebrow">Your guest site</span>
          <strong>Private preview · not published</strong>
          <span>Open preview ↗</span>
        </a>
        <a class="logout" href="../marketing/index.html" id="sidebarLogout">← Leave demo</a>
      </div>
    </aside>

    <main class="workspace" id="workspace" tabindex="-1"></main>

    <nav class="mobile-nav">
      <button data-view="overview" class="active"><span>⌂</span>Home</button>
      <button data-view="guests"><span>♙</span>Guests</button>
      <button data-view="website"><span>✦</span>Website</button>
      <button data-view="registry"><span>◇</span>Registry</button>
      <button data-view="settings"><span>⚙</span>Settings</button>
    </nav>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="bootstrap.js?v=20260831-3"></script>
</body>
</html>
